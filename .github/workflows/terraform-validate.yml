name: Terraform Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: modules
        shell: bash
        run: |
          modules=$(find aws azure -mindepth 2 -maxdepth 2 -name main.tf -exec dirname {} \; | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive ${{ matrix.module }}
      - name: Terraform init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: ${{ matrix.module }}
        run: terraform validate
